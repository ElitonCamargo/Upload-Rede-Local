<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --card: #ffffff;
      --text: #13203a;
      --accent: #1f6feb;
      --accent-hover: #1256c4;
      --border: #d9e2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 20%, #ffffff 0%, var(--bg) 45%, #e8efff 100%);
      color: var(--text);
    }

    .card {
      width: min(520px, 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 12px 35px rgba(15, 33, 73, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 18px;
      color: #465069;
      line-height: 1.5;
    }

    .action-box {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 16px;
      background: #f8fbff;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--accent);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .help {
      margin-top: 10px;
      font-size: 0.88rem;
      color: #5d6780;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Administracao</h1>
    <p>Clique no botao abaixo para baixar um arquivo ZIP com todas as pastas de envio e limpar o historico e os arquivos do sistema.</p>

    <section class="action-box">
      <form method="GET" action="/api/admin/backup">
        <button class="btn" type="submit">Baixar backup ZIP e limpar envios e uploads</button>
      </form>
      <p class="help">A limpeza do banco de envios e da pasta upload ocorre apos o envio do arquivo ZIP.</p>
    </section>
  </main>
</body>
</html>
